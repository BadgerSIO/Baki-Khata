<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Baki Khata - Digital Ledger & Customer Credit Tracker. Simple, fast, offline-first.">
  <meta name="theme-color" content="#004D40">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baki Khata">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Baki Khata - Digital Ledger</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #004D40;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: #ffffff;
      text-align: center;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .splash-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
    }
    .splash-subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin: 0 0 24px 0;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="favicon.png" alt="Baki Khata" class="splash-logo">
    <div class="splash-title">বাকী খাতা (Baki Khata)</div>
    <div class="splash-subtitle">ডিজিটাল হিসাব খাতা • Digital Ledger</div>
    <div class="splash-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
